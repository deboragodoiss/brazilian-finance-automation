name: Sync accounts to YNAB(You Need A Budget) every day at 6AM
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 6 * * *  # Every day at 6AM
  push:
      branches:
        - trunk
jobs:
  sync:
    env: # Mimics the .env file in the root of the repository
      YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
      PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
      PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}

      ACCOUNT_0_NAME: "Nubank Checking"
      ACCOUNT_0_PLUGGY_ID: ${{ secrets.ACCOUNT_0_PLUGGY_ID }}
      ACCOUNT_0_YNAB_BUDGET_ID: ${{ secrets.ACCOUNT_0_YNAB_BUDGET_ID }}
      ACCOUNT_0_YNAB_ID: ${{ secrets.ACCOUNT_0_YNAB_ID }}

      ACCOUNT_1_NAME: "Nubank Credit Card"
      ACCOUNT_1_PLUGGY_ID: ${{ secrets.ACCOUNT_1_PLUGGY_ID }}
      ACCOUNT_1_YNAB_BUDGET_ID: ${{ secrets.ACCOUNT_1_YNAB_BUDGET_ID }}
      ACCOUNT_1_YNAB_ID: ${{ secrets.ACCOUNT_1_YNAB_ID }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - run: uv --version
      - name: Install Python
        run: uv python install  # Installs the version in the .python-version file in the root of the repo
      - run: uv run python --version
      - name: Verify cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Run sync to YNAB
        run: make run
